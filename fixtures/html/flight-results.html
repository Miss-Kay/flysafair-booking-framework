<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Select your flight | Johannesburg to Dubai</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
    header { background: #d71921; color: #fff; padding: 16px 32px; }
    header h1 { font-size: 20px; margin: 0; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .route-summary { font-size: 15px; color: #555; margin-bottom: 16px; }
    .flight-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .flight-card:hover { border-color: #d71921; }
    .flight-no { font-weight: 700; color: #d71921; width: 90px; }
    .times { font-size: 18px; font-weight: 600; }
    .meta { font-size: 13px; color: #777; }
    .fare-btn { background: #d71921; color: #fff; border: 0; border-radius: 4px; padding: 12px 18px; font-size: 14px; cursor: pointer; }
    .fare-btn:hover { background: #b3151c; }
  </style>
</head>
<body>
  <header><h1>Emirates — choose your outbound flight</h1></header>
  <main>
    <p class="route-summary">
      Johannesburg (JNB) &rarr; Dubai (DXB) &middot; Return &middot; 1 adult &middot; Economy
    </p>

    <div class="flight-card" data-testid="flight-card">
      <div class="flight-no">EK 761</div>
      <div>
        <div class="times">13:55 &rarr; 00:10<sup>+1</sup></div>
        <div class="meta">JNB &rarr; DXB &middot; Non-stop &middot; 8h 15m &middot; Boeing 777-300ER</div>
      </div>
      <button class="fare-btn" data-testid="fare-economy">
        Economy from ZAR 9,420
      </button>
    </div>

    <div class="flight-card" data-testid="flight-card">
      <div class="flight-no">EK 763</div>
      <div>
        <div class="times">18:35 &rarr; 04:50<sup>+1</sup></div>
        <div class="meta">JNB &rarr; DXB &middot; Non-stop &middot; 8h 15m &middot; Airbus A380-800</div>
      </div>
      <button class="fare-btn" data-testid="fare-economy">
        Economy from ZAR 10,180
      </button>
    </div>
  </main>
</body>
</html>
